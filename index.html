<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>아트캠퍼스 메타버스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 화면 전체 3D 캔버스 위에 모서리마다 떠 있는 HUD 패널. 단일 테마(게임 세계) */
  --ink:#151925;
  --panel:rgba(21,25,37,.9);
  --panel-solid:#1d2233;
  --line:rgba(255,255,255,.12);
  --text:#f4f2ec;
  --muted:#a9aec0;
  --accent:#ffc94d;
  --c-lobby:#ffc94d; --c-art:#ff7a59; --c-toon:#2bb3c0; --c-novel:#8b6cf0;
  --font-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#bcd0e6;color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;transition:transform .12s,filter .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#2a1f00}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}

/* ---------- 캐릭터 만들기 ---------- */
.creator{position:fixed;inset:0;display:flex;pointer-events:none}
.cr-panel{pointer-events:auto;width:390px;height:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;backdrop-filter:blur(10px)}
.cr-head{padding:26px 24px 14px}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.cr-head h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.15;text-wrap:balance}
.cr-head p.sub{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
.cr-scroll{flex:1;overflow-y:auto;padding:4px 24px 18px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:700}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.name-in{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;color:var(--text)}
.name-in::placeholder{color:#7d8296}
.cr-foot{display:flex;gap:8px;padding:14px 24px 22px;border-top:1px solid var(--line)}
.cr-foot .primary{flex:1}
.cr-hint{position:absolute;right:22px;bottom:20px;font-size:13px;color:rgba(255,255,255,.7);pointer-events:none}

/* ---------- 월드 HUD ---------- */
.hud{position:fixed;inset:0;pointer-events:none}
.hud > *{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
.me{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px}
.me-dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;color:#1b1b1b}
.me b{display:block;font-size:15px}
.me span{font-size:12px;color:var(--muted)}
.room-pill{position:absolute;left:16px;top:72px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#191919;background:var(--accent);transition:background .3s}
.sample-chip{position:absolute;left:16px;top:108px;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);border:1px dashed rgba(255,255,255,.3);background:rgba(21,25,37,.75)}
.sample-chip:hover{color:var(--text)}
.tools{position:absolute;right:16px;top:16px;display:flex;gap:6px}
.tools .btn{padding:9px 13px;font-size:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
.mini-wrap{position:absolute;right:16px;top:64px;padding:8px}
.mini-wrap canvas{display:block;width:232px;height:150px;cursor:pointer;border-radius:8px}
.mini-cap{font-size:11px;color:var(--muted);padding:6px 2px 0;display:flex;justify-content:space-between}
.prompt{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:11px 18px;border-radius:999px;font-size:15px;display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
kbd{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:6px;background:var(--text);color:var(--ink);font:700 13px var(--font-body)}
.guide{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;font-size:14px;white-space:nowrap}
.guide svg{transition:transform .08s linear}
.guide .x{border:0;background:rgba(255,255,255,.1);border-radius:8px;width:28px;height:28px;cursor:pointer}
.toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-8px);font-family:var(--font-display);font-size:34px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-align:center}
.toast small{display:block;font-family:var(--font-body);font-size:14px;opacity:.85;margin-top:4px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{position:absolute;left:16px;bottom:16px;padding:14px 16px;font-size:13px;line-height:1.75;max-width:300px}
.help h3{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:18px}
.help ul{margin:0 0 10px;padding:0;list-style:none;color:var(--muted)}
.help li b{color:var(--text);font-weight:700}
.joy{position:absolute;left:24px;bottom:28px;width:124px;height:124px;border-radius:50%;background:rgba(21,25,37,.45);border:2px solid rgba(255,255,255,.25);touch-action:none}
.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85)}
.act{position:absolute;right:26px;bottom:40px;width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:#2a1f00;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.jump{position:absolute;right:122px;bottom:32px;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:13px}

/* ---------- 모달 ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,12,20,.5);display:grid;place-items:center;padding:16px;z-index:10}
.modal{width:min(660px,100%);max-height:min(82vh,760px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45);position:relative}
.m-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.08);cursor:pointer;font-size:18px}
.m-head{padding:22px 24px 16px;border-top:6px solid var(--acc,var(--accent));border-radius:18px 18px 0 0}
.m-eyebrow{margin:0;font-size:12px;letter-spacing:.08em;color:var(--acc,var(--accent));font-weight:700}
.m-head h2{margin:4px 0 0;font-family:var(--font-display);font-weight:400;font-size:28px;text-wrap:balance}
.m-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.m-body{padding:0 24px 24px;display:flex;flex-direction:column;gap:14px}
.files{list-style:none;margin:0;padding:0 16px 20px;display:flex;flex-direction:column;gap:6px}
.files h4{margin:12px 8px 2px;font-size:13px;color:var(--muted);font-weight:500}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent}
.file.hl{border-color:var(--acc,var(--accent));background:rgba(255,255,255,.08)}
.tag{font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;color:#171717;min-width:44px;text-align:center}
.t-pdf{background:#ff8a7a}.t-img{background:#ffd36e}.t-vid{background:#c39bff}.t-doc{background:#8cc7ff}.t-sheet{background:#8fe0a5}.t-src{background:#f7a8d0}.t-zip{background:#d6d0c2}.t-link{background:#b7c0d6}
.f-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f-desc{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.f-act{display:flex;gap:6px}
.new{font-size:10px;background:var(--accent);color:#2a1f00;padding:2px 6px;border-radius:5px}
.nolink{font-size:12px;color:#7d8296;border:1px dashed rgba(255,255,255,.2);padding:6px 9px;border-radius:8px;white-space:nowrap}
.search-in{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;font-size:16px;color:var(--text)}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.res .path{font-size:12px;color:var(--muted)}
.res .dot{width:10px;height:10px;border-radius:50%}
.empty{color:var(--muted);font-size:14px;padding:12px 4px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;text-align:left}
.quick button:hover{background:rgba(255,255,255,.09)}
.quick b{font-family:var(--font-display);font-weight:400;font-size:20px}
.quick span{font-size:12px;color:var(--muted)}
.npc-say{background:rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;line-height:1.65;font-size:15px}
.cols{display:flex;flex-wrap:wrap;gap:4px}
.cols code{font:12px/1 var(--font-body);background:rgba(255,255,255,.1);padding:6px 8px;border-radius:6px}
.set-box{width:100%;min-height:120px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--text);resize:vertical}
.set-row{display:flex;gap:8px;flex-wrap:wrap}
.set-row input{flex:1;min-width:200px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--text)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.msg{font-size:13px;min-height:18px;color:var(--accent)}
.m-body h3{margin:6px 0 0;font-size:15px}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:20;font-family:var(--font-display);font-size:24px;transition:opacity .4s}

@media (max-width:760px){
  .creator{flex-direction:column-reverse}
  .cr-panel{width:100%;height:58%;border-right:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
  .cr-head{padding:16px 18px 8px}
  .cr-head h1{font-size:22px}
  .cr-head p.sub{display:none}
  .cr-scroll{padding:4px 18px 12px;gap:12px}
  .cr-foot{padding:10px 18px 16px}
  .cr-hint{top:16px;bottom:auto;right:16px}
  .tools{top:auto;bottom:auto;right:16px;top:16px}
  .tools .btn{padding:8px 10px;font-size:13px}
  .mini-wrap{top:60px;padding:6px}
  .mini-wrap canvas{width:150px;height:97px}
  .mini-cap{display:none}
  .me{padding:7px 10px 7px 7px}
  .me-dot{width:28px;height:28px;font-size:15px}
  .room-pill{top:62px}
  .sample-chip{top:96px;max-width:46vw}
  .prompt{bottom:180px}
  .help{display:none}
  .toast{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  .toast,.btn{transition:none}
}
</style>

<body>
<canvas id="gl" tabindex="0" aria-label="아트캠퍼스 3D 공간"></canvas>
<div id="loading" class="loading">캠퍼스 문 여는 중…</div>

<!-- 캐릭터 만들기 -->
<section id="creator" class="creator" hidden>
  <div class="cr-panel">
    <div class="cr-head">
      <p class="eyebrow">캐릭터 만들기</p>
      <h1>캠퍼스에서 돌아다닐<br>나를 꾸며요</h1>
      <p class="sub">이름표에는 이름과 직무가 표시돼요. 만든 캐릭터는 이 브라우저에 저장돼서 다음에 바로 입장할 수 있어요.</p>
    </div>
    <div class="cr-scroll" id="crFields"></div>
    <div class="cr-foot">
      <button class="btn ghost" id="btnRandom" type="button">랜덤</button>
      <button class="btn primary" id="btnEnter" type="button">캠퍼스 입장</button>
    </div>
  </div>
  <div class="cr-hint">캐릭터를 드래그하면 돌아가요</div>
</section>

<!-- 월드 HUD -->
<div id="hud" class="hud" hidden>
  <div class="me glass"><div class="me-dot" id="meDot"></div><div><b id="meName"></b><span id="meRole"></span></div></div>
  <div class="room-pill" id="roomPill">로비</div>
  <button class="sample-chip" id="sampleChip" type="button">예시 자료가 보이는 중 · 자료 연결하기</button>
  <div class="tools">
    <button class="btn" data-ui="search" type="button">검색</button>
    <button class="btn" data-ui="data" type="button">자료 관리</button>
    <button class="btn" data-ui="avatar" type="button">캐릭터</button>
  </div>
  <div class="mini-wrap glass">
    <canvas id="mini" aria-label="미니맵. 클릭하면 그 위치로 순간이동"></canvas>
    <div class="mini-cap"><span>지도를 누르면 순간이동</span><span id="miniCount"></span></div>
  </div>
  <div class="guide glass" id="guide" hidden>
    <svg id="guideArrow" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2 L22 20 L13 15 L4 20 Z" fill="#ffc94d"/></svg>
    <span id="guideText"></span>
    <button class="x" id="guideX" type="button" aria-label="길 안내 끄기">✕</button>
  </div>
  <div class="prompt glass" id="prompt" hidden></div>
  <div class="toast" id="toast"></div>
  <div class="help glass" id="help" hidden>
    <h3>이렇게 움직여요</h3>
    <ul>
      <li><b>W A S D</b> 또는 방향키로 이동, <b>Shift</b> 달리기</li>
      <li><b>마우스 드래그</b> 시점 회전, <b>휠</b> 확대·축소</li>
      <li><b>E</b> 책장 열람, <b>Space</b> 점프</li>
      <li>책장을 클릭해도 열려요. 지도를 누르면 순간이동</li>
    </ul>
    <button class="btn sm ghost" id="helpOk" type="button">알겠어요</button>
  </div>
  <div class="joy" id="joy" hidden><div class="joy-knob" id="joyKnob"></div></div>
  <button class="jump" id="btnJump" type="button" hidden>점프</button>
  <button class="act" id="btnAct" type="button" hidden>열람</button>
</div>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="m-close" id="modalClose" type="button" aria-label="닫기">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   1. 공간 · 자료 정의
   ========================================================= */

const TYPES = {

};
const SAMPLE_ROWS = [
  ['로비','공지 게시판','11월 운영 일정표','PDF',1,'휴강일 · 특강 · 상담 집중 주간'],

function typeOf(f){
  const raw = String(f.type||'').trim().toLowerCase();
  if(TYPES[raw]) return TYPES[raw];
  const s = (f.link+' '+f.name).toLowerCase();
  if(/\.pdf\b/.test(s)) return TYPES.pdf;
  if(/\.(png|jpe?g|gif|webp)\b/.test(s)) return TYPES['이미지'];
  if(/\.(mp4|mov|avi)\b|youtu/.test(s)) return TYPES['영상'];
  if(/spreadsheets|\.xlsx?\b|\.csv\b/.test(s)) return TYPES['시트'];
  if(/document|\.docx?\b|\.hwp\b/.test(s)) return TYPES['문서'];
  if(/\.(psd|clip|blend)\b/.test(s)) return TYPES['원본'];
  if(/\.(zip|rar|7z)\b/.test(s)) return TYPES['압축'];
  return raw ? [f.type,'link'] : TYPES['링크'];
}

function linksFor(u){
  u = String(u||'').trim();
  if(!/^https?:\/\//i.test(u)) return null;
  let m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{15,})/);
  if(m) return {open:`https://drive.google.com/file/d/${m[1]}/view`, dl:`https://drive.google.com/uc?export=download&id=${m[1]}`};
  m = u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]{15,})/);
  if(m){ const fmt = {document:'pdf', spreadsheets:'xlsx', presentation:'pptx'}[m[1]]; return {open:u, dl:`https://docs.google.com/${m[1]}/d/${m[2]}/export?format=${fmt}`}; }
  return {open:u, dl:u};
}

function parseTable(text){
  text = text.replace(/\r/g,'').trim(); if(!text) return [];
  const rows = [];
  if(text.includes('\t')){ text.split('\n').forEach(l => rows.push(l.split('\t'))); }
  else {
    let row=[], cell='', q=false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=c;
    }
    row.push(cell); rows.push(row);
  }
  const keys = {room:/강의실|공간|방|room/i, shelf:/책장|분류|카테고리|shelf/i, name:/자료명|제목|이름|name|title/i, type:/유형|종류|type/i, link:/링크|url|주소|link/i, date:/등록일|날짜|date/i, desc:/설명|메모|비고|desc/i};
  let order = ['room','shelf','name','type','link','date','desc'];
  const head = rows[0].map(s=>s.trim());
  if(head.some(h => keys.name.test(h) || keys.room.test(h))){
    order = head.map(h => Object.keys(keys).find(k => keys[k].test(h)) || null);
    rows.shift();
  }
  return rows.map(r => { const o = {room:'',shelf:'',name:'',type:'',link:'',date:'',desc:''}; order.forEach((k,i)=>{ if(k) o[k] = (r[i]||'').trim(); });
      const dm = o.date.replace(/\s/g,'').match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/); o.date = dm ? `${dm[1]}-${dm[2].padStart(2,'0')}-${dm[3].padStart(2,'0')}` : ''; return o; })
             .filter(o => o.name && ROOM_ALIAS[o.room.replace(/\s/g,'')]);
}

function shelfModel(slot, color, label, hasNew){
  const g = new THREE.Group(); g.position.set(slot.x,0,slot.z); g.rotation.y = slot.yaw; stationGroup.add(g);
  if(slot.kind==='board'){
    bx(2.8,1.8,.08,M('#3b4050'),0,1.65,-.1,g); bx(2.6,1.6,.04,M('#c99a6b'),0,1.65,-.04,g,false);
    const r = rng(7); for(let i=0;i<7;i++){ const n = bx(.42,.5,.01,M(['#fff7d6','#ffe1e1','#dff3ff','#e8ffe0','#ffffff'][i%5]),-1.0+(i%4)*.62+r()*.1,2.05-Math.floor(i/4)*.7+r()*.08,-.01,g,false); n.rotation.z = (r()-.5)*.2; }
    signMesh(signTex(label,{accent:color,size:120}),2.4,.55,0,2.85,0,0,g);
    addCollider(stationColliders,slot.x,slot.z,2.8,.4,slot.yaw);
  } else {
    const wood = M('#8a6248'); const W = 2.2, Hh = 2.4, D = .55;
    bx(W,Hh,.05,wood,0,Hh/2,-D/2+.03,g); bx(.08,Hh,D,wood,-W/2+.04,Hh/2,0,g); bx(.08,Hh,D,wood,W/2-.04,Hh/2,0,g);
    for(let i=0;i<5;i++) bx(W,.05,D,wood,0,.04+i*.58,0,g,false);
    const base = new THREE.Color(color); const pal = [color,'#'+base.clone().offsetHSL(0,0,.15).getHexString(),'#'+base.clone().offsetHSL(0,-.2,-.15).getHexString(),'#efe7da','#2f3445','#d9c3a5'];
    addBooks(g,W-.12,4,.58,.07,rng(label.length*31+slot.x*7|0),pal);
    bx(2.3,.56,.06,M('#151925'),0,2.72,.0,g);
    signMesh(signTex(label,{accent:color,size:120}),2.26,.54,0,2.72,.035,0,g);
    addCollider(stationColliders,slot.x,slot.z,W,D+.1,slot.yaw);
  }
  const ring = new THREE.Mesh(new THREE.RingGeometry(.55,.78,40), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.55, side:THREE.DoubleSide, depthWrite:false}));
  ring.rotation.x = -H; ring.position.set(0,.025,1.35); g.add(ring);
  let badge = null;
  if(hasNew){ badge = new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(256,128,(x)=>{ x.fillStyle='#ffc94d'; rr(x,8,14,240,100,50); x.fill(); x.fillStyle='#2a1f00'; x.font='72px "Do Hyeon", sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('NEW',128,66); }), depthTest:true}));
    badge.scale.set(.9,.45,1); badge.position.set(0,3.35,0); g.add(badge); }
  return {group:g, ring, badge};
}
function buildStations(){
  if(stationGroup) scene.remove(stationGroup);
  stationGroup = new THREE.Group(); scene.add(stationGroup);
  stations = []; stationColliders.length = 0;
  for(let i=clickables.length-1;i>=0;i--) if(clickables[i].kind==='station') clickables.splice(i,1);
  for(const rid of Object.keys(ROOMS)){
    const rows = catalog.filter(f => ROOM_ALIAS[f.room.replace(/\s/g,'')]===rid);
    const shelves = [...new Set(rows.map(f => f.shelf || '자료'))];
    SLOTS[rid].forEach((slot,i) => {
      const names = i < SLOTS[rid].length-1 ? shelves.slice(i,i+1) : shelves.slice(i);
      if(!names.length){ if(slot.kind!=='board') shelfModel(slot,'#8a8f9f','빈 책장',false); return; }
      const files = rows.filter(f => names.includes(f.shelf || '자료'));
      const hasNew = files.some(isNew);
      const label = names.length > 1 ? `${names[0]} 외 ${names.length-1}` : names[0];
      const m = shelfModel(slot, ROOMS[rid].color, label, hasNew);
      const f = {x:Math.sin(slot.yaw), z:Math.cos(slot.yaw)};
      const st = {id:`${rid}-${i}`, room:rid, title:label, shelves:names, files, hasNew, slot,
        pos:new THREE.Vector3(slot.x,0,slot.z), front:new THREE.Vector3(slot.x+f.x*1.35,0,slot.z+f.z*1.35), ...m};
      stations.push(st); clickables.push({obj:m.group, kind:'station', st});
    });
  }
  const total = catalog.length; $('#miniCount').textContent = `자료 ${total}개`;
  $('#sampleChip').hidden = !usingSample;
}

const keys = new Set(), joy = {x:0,y:0}, ray = new THREE.Raycaster(), camPos = new THREE.Vector3(); let camSnap = true;

function collides(x,z,r=.34){ for(const L of [colliders, stationColliders]) for(const c of L){ if(x+r>c.x1 && x-r<c.x2 && z+r>c.z1 && z-r<c.z2) return true; } return false; }
function tryMove(dx,dz){ const p = player.position; if(!collides(p.x+dx,p.z)) p.x += dx; if(!collides(p.x,p.z+dz)) p.z += dz; }
function roomAt(x,z){ for(const r of Object.values(ROOMS)) if(x>=r.x[0] && x<=r.x[1] && z>=r.z[0] && z<=r.z[1]) return r; return null; }
function teleport(x,z,yaw){
  player.position.set(x,0,z); targetYaw = yaw; player.rotation.y = yaw; camYaw = yaw+Math.PI; camSnap = true;
  poof.position.set(x,.04,z); poofT = 0;
}
function teleportRoom(rid){ const s = ROOMS[rid].spawn; teleport(s[0],s[1],s[2]); }
function teleportStation(st){ teleport(st.front.x, st.front.z, st.slot.yaw+Math.PI); }

function enterWorld(){
  if(!avatar.name) avatar.name = '직원' + Math.floor(10+Math.random()*89);
  store.set('mc.avatar', avatar);
  if(!worldBuilt) buildWorld();
  const pos = player ? player.position.clone() : null, rot = player ? player.rotation.y : Math.PI;
  if(player) scene.remove(player);
  player = buildCharacter(avatar); player.add(nameTag(avatar.name, avatar.role)); scene.add(player);
  if(pos){ player.position.copy(pos); player.rotation.y = rot; } else teleportRoom('lobby');
  $('#meName').textContent = avatar.name; $('#meRole').textContent = avatar.role + ' · 아트캠퍼스';
  const dot = $('#meDot'); dot.style.background = roleColor(avatar.role); dot.textContent = avatar.name.slice(0,1);
  $('#creator').hidden = true; $('#hud').hidden = false; mode = 'world';
  $('#help').hidden = isTouch || !!store.get('mc.helpSeen');
  $('#joy').hidden = $('#btnJump').hidden = !isTouch;
  currentRoom = null; resize(); canvas.focus();
}
function openCreator(){ mode = 'creator'; $('#hud').hidden = true; $('#creator').hidden = false; closeModal(); renderFields(); refreshPreview(); resize(); }

addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('input,textarea')) { if(e.key==='Escape') closeModal(); return; }
  if(e.key==='Escape'){ closeModal(); return; }
  if(mode!=='world' || modalOpen()) return;
  keys.add(e.code);
  if(e.code==='KeyE' || e.code==='Enter') interact();
  if(e.code==='Space'){ jump(); e.preventDefault(); }
  if(e.code==='KeyF'){ openSearch(); e.preventDefault(); }
  if(e.code==='KeyM'){ openHelpDesk(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
function jump(){ if(onGround){ vy = 5.2; onGround = false; } }

// 시점 드래그 / 클릭
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = {id:e.pointerId, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if(!drag || drag.id!==e.pointerId) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if(mode==='world'){ camYaw -= dx*.006; camPitch = clamp(camPitch+dy*.005,.12,1.25); }
  else if(mode==='creator'){ previewYaw += dx*.012; }
});
canvas.addEventListener('pointerup', e => {
  if(!drag || drag.id!==e.pointerId) return; const moved = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy); drag = null;
  if(moved < 6 && mode==='world') clickWorld(e);
});
canvas.addEventListener('wheel', e => { if(mode==='world'){ camDist = clamp(camDist+e.deltaY*.01,3.5,15); e.preventDefault(); } }, {passive:false});
function clickWorld(e){
  const r = canvas.getBoundingClientRect(); const v = new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(v, wCam); ray.far = 60;
  const hits = ray.intersectObjects(clickables.map(c=>c.obj), true); if(!hits.length) return;
  let o = hits[0].object; let c = null; while(o && !c){ c = clickables.find(k => k.obj===o); o = o.parent; }
  if(!c) return;
  if(c.kind==='npc'){ if(player.position.distanceTo(npc.position) < 8) openHelpDesk(); else setGuide({front:new THREE.Vector3(4.2,0,3), label:'안내 데스크'}); return; }
  const st = c.st; if(player.position.distanceTo(st.front) < 8) openStation(st); else { setGuide(st); toast('길 안내를 시작해요', `${ROOMS[st.room].full} › ${st.title}`); }
}
// 가상 조이스틱
{ const el = $('#joy'), knob = $('#joyKnob'); let id = null, cx = 0, cy = 0;
  el.addEventListener('pointerdown', e => { id = e.pointerId; el.setPointerCapture(id); const r = el.getBoundingClientRect(); cx = r.left+r.width/2; cy = r.top+r.height/2; move(e); e.stopPropagation(); });
  const move = e => { if(e.pointerId!==id) return; let dx = e.clientX-cx, dy = e.clientY-cy; const d = Math.hypot(dx,dy), R = 50; if(d>R){ dx*=R/d; dy*=R/d; } joy.x = dx/R; joy.y = -dy/R; knob.style.transform = `translate(${dx}px,${dy}px)`; };
  el.addEventListener('pointermove', move);
  const end = e => { if(e.pointerId!==id) return; id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); }

function fileRow(f, hl){
  const [label, key] = typeOf(f); const L = linksFor(f.link);
  const act = L ? `<a class="btn sm primary" href="${esc(L.open)}" target="_blank" rel="noopener">열기</a><a class="btn sm ghost" href="${esc(L.dl)}" target="_blank" rel="noopener">다운로드</a>` : `<span class="nolink">링크 미등록</span>`;
  const meta = [f.desc, f.date].filter(Boolean).map(esc).join(' · ');
  return `<li class="file${hl?' hl':''}"><span class="tag t-${key}">${esc(label)}</span><div><div class="f-name">${esc(f.name)}${isNew(f)?'<b class="new">NEW</b>':''}</div>${meta?`<div class="f-desc">${meta}</div>`:''}</div><div class="f-act">${act}</div></li>`;
}
function openStation(st, highlight){
  const room = ROOMS[st.room]; const nNew = st.files.filter(isNew).length;
  let list = '';
  st.shelves.forEach(s => { const fs = st.files.filter(f => (f.shelf||'자료')===s); if(st.shelves.length>1) list += `<h4>${esc(s)}</h4>`; list += fs.map(f => fileRow(f, f===highlight)).join(''); });
  openModal(`<header class="m-head"><p class="m-eyebrow">${esc(room.full)}</p><h2>${esc(st.title)}</h2><p class="m-sub">자료 ${st.files.length}개${nNew?` · 이번 주 새 자료 ${nNew}개`:''}${usingSample?' · 예시 자료라 링크가 비어 있어요':''}</p></header><ul class="files">${list}</ul>`, room.color);
  if(guideTarget && guideTarget.id===st.id) setGuide(null);
}
let flat = [];
function openSearch(){
  flat = []; stations.forEach(st => st.files.forEach(f => flat.push({f, st})));
  openModal(`<header class="m-head"><p class="m-eyebrow">자료 찾기</p><h2>어떤 자료를 찾으세요?</h2><p class="m-sub">자료명, 설명, 책장, 강의실 이름으로 찾아요. 찾은 자료로 순간이동하거나 길 안내를 받을 수 있어요.</p></header>
    <div class="m-body"><input class="search-in" id="q" type="search" placeholder="예: 커리큘럼, 콘티, 상담" autocomplete="off"><ul class="results" id="results"></ul></div>`);
  const q = $('#q'); const render = () => {
    const s = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const hits = flat.map((h,i)=>({...h,i})).filter(({f,st}) => { const hay = `${f.name} ${f.desc} ${f.shelf} ${ROOMS[st.room].full} ${f.type}`.toLowerCase(); return s.every(w => hay.includes(w)); })
      .sort((a,b) => (isNew(b.f)-isNew(a.f))).slice(0,40);
    $('#results').innerHTML = hits.length ? hits.map(({f,st,i}) => `<li class="res"><span class="dot" style="background:${ROOMS[st.room].color}"></span><div><div class="f-name">${esc(f.name)}${isNew(f)?'<b class="new">NEW</b>':''}</div><div class="path">${esc(ROOMS[st.room].full)} › ${esc(f.shelf||st.title)}</div></div><div class="f-act"><button class="btn sm" data-action="go" data-i="${i}" type="button">순간이동</button><button class="btn sm ghost" data-action="guide" data-i="${i}" type="button">길 안내</button></div></li>`).join('')
      : `<li class="empty">맞는 자료가 없어요. 다른 단어로 찾아보세요.</li>`;
  };
  q.addEventListener('input', render); render(); setTimeout(()=>q.focus(),30);
}
function openHelpDesk(){
  const card = rid => `<button type="button" data-action="tp" data-room="${rid}" style="border-left:4px solid ${ROOMS[rid].color}"><b>${ROOMS[rid].full}</b><span>${ROOMS[rid].desc}</span></button>`;
  const nNew = catalog.filter(isNew).length;
  openModal(`<header class="m-head"><p class="m-eyebrow">안내 데스크 · 하나</p><h2>${esc(avatar.name)}님, 어디로 모실까요?</h2></header>
    <div class="m-body"><div class="npc-say">이번 주에 새로 올라온 자료가 <b>${nNew}개</b> 있어요. 노란 <b>NEW</b> 표시가 떠 있는 책장을 확인해 보세요. 자료는 <b>자료 관리</b>에서 구글 시트로 바꿀 수 있어요.</div>
    <div class="quick">${card('art')}${card('toon')}${card('novel')}${card('lobby')}</div>
    <div class="set-row"><button class="btn primary" data-action="search" type="button">자료 검색</button><button class="btn ghost" data-action="settings" type="button">자료 관리</button></div></div>`);
}
function openSettings(){
  const url = store.get('mc.csvUrl') || '';
  openModal(`<header class="m-head"><p class="m-eyebrow">자료 관리</p><h2>구글 시트로 책장을 채워요</h2><p class="m-sub">현재 ${usingSample?'예시 자료':'연결한 자료'} ${catalog.length}개가 보이고 있어요.</p></header>
    <div class="m-body">
      <h3>1. 시트에 이 순서로 열을 만드세요</h3>
      <div class="cols"><code>강의실</code><code>책장</code><code>자료명</code><code>유형</code><code>링크</code><code>등록일</code><code>설명</code></div>
      <p class="note">강의실은 <b>로비 · 게임원화 · 웹툰 · 웹소설</b> 중 하나. 책장 이름이 같은 자료끼리 한 책장에 꽂혀요 (방마다 4개, 로비 1개). 유형은 PDF · 이미지 · 영상 · 문서 · 시트 · 원본 · 압축 · 링크. 링크는 구글 드라이브 공유 링크를 넣으면 열기·다운로드 주소가 자동으로 만들어져요. 등록일이 7일 이내면 NEW가 붙어요.</p>
      <div class="set-row"><button class="btn sm ghost" data-action="copyhead" type="button">머리글 줄 복사</button><button class="btn sm ghost" data-action="copysample" type="button">예시 전체 복사</button></div>
      <h3>2. 시트 범위를 복사해서 붙여넣기</h3>
      <textarea class="set-box" id="pasteBox" placeholder="구글 시트에서 머리글 포함 범위를 선택하고 Ctrl+C, 여기에 Ctrl+V"></textarea>
      <div class="set-row"><button class="btn primary" data-action="apply" type="button">책장에 적용</button><button class="btn ghost" data-action="reset" type="button">예시로 되돌리기</button></div>
      <h3>3. 모든 직원에게 같은 자료 보여주기 (공용 시트)</h3>
      <p class="note">${sharedSheetUrl ? `공용 시트가 연결돼 있어요${sheetLoadedAt ? ` · ${sheetLoadedAt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}에 불러옴` : ' · 불러오기 실패, 시트 게시 상태를 확인해 주세요'}. 시트를 고치면 직원들이 새로고침할 때 반영돼요.` : '아직 공용 시트가 없어서 위에서 붙여넣은 자료는 이 브라우저에만 보여요. 구글 시트에서 <b>파일 → 공유 → 웹에 게시 → CSV</b>로 주소를 만든 뒤, 사이트 폴더의 <b>config.json</b>에 넣으면 모든 직원에게 같은 자료가 보여요.'}</p>
      <div class="set-row"><input id="csvUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" value="${esc(sharedSheetUrl || url)}"><button class="btn ghost" data-action="fetch" type="button">${sharedSheetUrl ? '다시 불러오기' : '이 주소로 미리 보기'}</button></div>
      <div class="msg" id="setMsg" role="status"></div>
    </div>`);
}
function applyCatalog(rows, src){
  if(!rows.length){ $('#setMsg').textContent = '읽을 수 있는 줄이 없어요. 강의실 칸에 로비·게임원화·웹툰·웹소설 중 하나가 있는지 확인해 주세요.'; return; }
  catalog = rows; usingSample = false; store.set('mc.catalog', rows); buildStations(); setGuide(null);
  $('#setMsg').textContent = `${src}에서 자료 ${rows.length}개를 불러와 책장에 꽂았어요.`;
}
$('#modalBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-action]'); if(!b) return; const a = b.dataset.action;
  if(a==='go' || a==='guide'){ const {f, st} = flat[+b.dataset.i]; closeModal(); if(a==='go'){ teleportStation(st); setTimeout(()=>openStation(st,f),350); } else { setGuide(st); toast('길 안내를 시작해요', `${ROOMS[st.room].full} › ${st.title}`); } }
  else if(a==='tp'){ closeModal(); teleportRoom(b.dataset.room); }
  else if(a==='search'){ openSearch(); }
  else if(a==='settings'){ openSettings(); }
  else if(a==='apply'){ applyCatalog(parseTable($('#pasteBox').value), '붙여넣은 표'); }
  else if(a==='reset'){ store.del('mc.catalog'); catalog = SAMPLE; usingSample = true; buildStations(); $('#setMsg').textContent = '예시 자료로 되돌렸어요.'; }
  else if(a==='copyhead' || a==='copysample'){
    const head = '강의실\t책장\t자료명\t유형\t링크\t등록일\t설명';
    const txt = a==='copyhead' ? head : head + '\n' + SAMPLE.map(f => [f.room,f.shelf,f.name,f.type,f.link,f.date,f.desc].join('\t')).join('\n');
    try{ await navigator.clipboard.writeText(txt); $('#setMsg').textContent = '복사했어요. 구글 시트 A1 칸에 붙여넣으세요.'; }
    catch(err){ $('#pasteBox').value = txt; $('#setMsg').textContent = '복사가 막혀 있어서 아래 칸에 넣어 두었어요. 직접 선택해서 복사하세요.'; }
  }
  else if(a==='fetch'){
    const u = $('#csvUrl').value.trim(); if(!/^https:\/\//.test(u)){ $('#setMsg').textContent = 'https 로 시작하는 CSV 주소를 넣어 주세요.'; return; }
    if(u!==sharedSheetUrl) store.set('mc.csvUrl', u); $('#setMsg').textContent = '불러오는 중…';
    try{ const n = await loadSheet(u); setGuide(null); $('#setMsg').textContent = `시트에서 자료 ${n}개를 불러와 책장에 꽂았어요.`; }
    catch(err){ $('#setMsg').textContent = '불러오지 못했어요. 시트가 "웹에 게시 → CSV"로 되어 있는지, 주소가 output=csv로 끝나는지 확인해 주세요. (claude.ai 미리보기 안에서는 외부 연결이 막혀 있어요)'; }
  }
});

/* =========================================================
   10. 미니맵
   ========================================================= */
const mini = $('#mini'), mctx = mini.getContext('2d');
const MB = {x0:-29, x1:29, z0:-25, z1:11};
function miniSize(){ const r = mini.getBoundingClientRect(); const d = Math.min(devicePixelRatio,2); mini.width = Math.max(1,r.width*d); mini.height = Math.max(1,r.height*d); }
function toMini(x,z){ const W = mini.width, Hh = mini.height; const s = Math.min(W/(MB.x1-MB.x0), Hh/(MB.z1-MB.z0)); const ox = (W-(MB.x1-MB.x0)*s)/2, oz = (Hh-(MB.z1-MB.z0)*s)/2; return [ox+(x-MB.x0)*s, oz+(z-MB.z0)*s, s]; }
function drawMini(t){
  const W = mini.width, Hh = mini.height; mctx.clearRect(0,0,W,Hh);
  for(const r of Object.values(ROOMS)){ const [a,b,s] = toMini(r.x[0],r.z[0]); const w = (r.x[1]-r.x[0])*s, h = (r.z[1]-r.z[0])*s;
    mctx.fillStyle = r.color + (currentRoom===r ? '88' : '40'); mctx.fillRect(a,b,w,h); mctx.strokeStyle = 'rgba(255,255,255,.55)'; mctx.lineWidth = 1.5; mctx.strokeRect(a,b,w,h);
    mctx.fillStyle = 'rgba(255,255,255,.9)'; mctx.font = `700 ${Math.max(9,s*1.9)}px "Noto Sans KR", sans-serif`; mctx.textAlign = 'center'; mctx.textBaseline = 'middle'; mctx.fillText(r.name, a+w/2, b+h/2); }
  for(const st of stations){ const [x,z,s] = toMini(st.pos.x, st.pos.z); const pulse = st.hasNew ? 1+.35*Math.sin(t*5) : 1;
    mctx.fillStyle = st.hasNew ? '#ffc94d' : '#ffffff'; mctx.beginPath(); mctx.arc(x,z,s*.55*pulse,0,Math.PI*2); mctx.fill(); }
  if(guideTarget){ const [x,z,s] = toMini(guideTarget.front.x, guideTarget.front.z); mctx.strokeStyle = '#ffc94d'; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(x,z,s*(1+.4*Math.sin(t*6)),0,Math.PI*2); mctx.stroke(); }
  if(player){ const [x,z,s] = toMini(player.position.x, player.position.z); const a = player.rotation.y; mctx.save(); mctx.translate(x,z); mctx.rotate(-a+Math.PI);
    mctx.fillStyle = roleColor(avatar.role); mctx.strokeStyle = '#151925'; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.moveTo(0,-s*1.3); mctx.lineTo(s*.9,s*.9); mctx.lineTo(0,s*.4); mctx.lineTo(-s*.9,s*.9); mctx.closePath(); mctx.fill(); mctx.stroke(); mctx.restore(); }
}
mini.addEventListener('click', e => {
  const r = mini.getBoundingClientRect(); const px = (e.clientX-r.left)*(mini.width/r.width), pz = (e.clientY-r.top)*(mini.height/r.height);
  const [ox,oz,s] = toMini(MB.x0,MB.z0); const x = (px-ox)/s+MB.x0, z = (pz-oz)/s+MB.z0;
  const room = roomAt(x,z); if(!room) return;
  if(!collides(x,z,.4) && x>room.x[0]+.6 && x<room.x[1]-.6 && z>room.z[0]+.6 && z<room.z[1]-.6) teleport(x,z,player.rotation.y); else teleportRoom(room.id);
});

/* =========================================================
   11. 루프
   ========================================================= */
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false);
  wCam.aspect = w/h; wCam.updateProjectionMatrix();
  cCam.aspect = w/h; cCam.clearViewOffset();
  if(mode==='creator'){ const p = document.querySelector('.cr-panel').getBoundingClientRect(); if(w>760) cCam.setViewOffset(w,h,-p.width/2,0,w,h); else cCam.setViewOffset(w,h,0,p.height/2,w,h); }
  cCam.updateProjectionMatrix();
  if(mode==='world') miniSize();
}
addEventListener('resize', resize);
const clock = new THREE.Clock(); let T = 0;
function updateCreator(dt){
  if(!previewChar) return;
  previewChar.rotation.y += (previewYaw-previewChar.rotation.y)*Math.min(1,dt*10);
  hop = Math.max(0,hop-dt*3.2); previewChar.position.y = Math.sin((1-hop)*Math.PI)*hop*.25;
  animateChar(previewChar, dt, false, 0, T);
  const u = previewChar.userData; u.armR.rotation.z = (Math.sin(T*.8) > .7) ? -2.4 + Math.sin(T*12)*.3 : u.armR.rotation.z*.9;
  turnRing.material.color.set(roleColor(avatar.role));
}
function updateWorld(dt){
  let ix = 0, iz = 0;
  if(!modalOpen()){
    if(keys.has('KeyW')||keys.has('ArrowUp')) iz += 1; if(keys.has('KeyS')||keys.has('ArrowDown')) iz -= 1;
    if(keys.has('KeyD')||keys.has('ArrowRight')) ix += 1; if(keys.has('KeyA')||keys.has('ArrowLeft')) ix -= 1;
    ix += joy.x; iz += joy.y;
  }
  const len = Math.hypot(ix,iz), moving = len > .1;
  let speed = 0;
  if(moving){ const n = Math.max(1,len); ix /= n; iz /= n;
    const Fx = -Math.sin(camYaw), Fz = -Math.cos(camYaw), Rx = Math.cos(camYaw), Rz = -Math.sin(camYaw);
    const dx = Fx*iz+Rx*ix, dz = Fz*iz+Rz*ix;
    speed = ((keys.has('ShiftLeft')||keys.has('ShiftRight')||Math.hypot(joy.x,joy.y)>.92) ? 7.2 : 4.2) * Math.min(1,len);
    tryMove(dx*speed*dt, dz*speed*dt); targetYaw = Math.atan2(dx,dz);
  }
  player.rotation.y = lerpAngle(player.rotation.y, targetYaw, 1-Math.exp(-12*dt));
  vy -= 16*dt; player.position.y = Math.max(0, player.position.y+vy*dt); if(player.position.y===0){ vy = 0; onGround = true; }
  animateChar(player, dt, moving && onGround, speed, T);
  animateChar(npc, dt, false, 0, T+1.7);
  // 카메라
  const tgt = new THREE.Vector3(player.position.x, player.position.y+1.3, player.position.z);
  // 벽에 가리면 먼저 카메라를 위로 올려 벽 너머로 보고, 그래도 막히면 거리를 줄인다
  const dir = new THREE.Vector3(); let d = camDist, hit = null;
  for(let p = camPitch; p <= 1.36; p += .08){
    const cp = Math.cos(p); dir.set(Math.sin(camYaw)*cp, Math.sin(p), Math.cos(camYaw)*cp);
    ray.set(tgt, dir); ray.far = camDist; hit = ray.intersectObjects(wallMeshes,false)[0];
    if(!hit) break;
  }
  if(hit) d = Math.max(2.2, hit.distance-.3);
  camPos.copy(tgt).addScaledVector(dir,d);
  wCam.position.lerp(camPos, camSnap ? 1 : 1-Math.exp(-14*dt)); camSnap = false; wCam.lookAt(tgt);
  // 방 감지
  const room = roomAt(player.position.x, player.position.z);
  if(room && room!==currentRoom){ const first = currentRoom===null; currentRoom = room; $('#roomPill').textContent = room.full; $('#roomPill').style.background = room.color; if(!first) toast(room.full, room.desc); else toast('아트캠퍼스에 오신 걸 환영해요', '안내 데스크의 하나에게 말을 걸어 보세요'); }
  // 가까운 책장
  nearStation = null; let best = 2.0;
  for(const st of stations){ const dd = Math.hypot(player.position.x-st.front.x, player.position.z-st.front.z); if(dd < best){ best = dd; nearStation = st; } }
  nearNpc = !nearStation && Math.hypot(player.position.x-npc.position.x, player.position.z-npc.position.z) < 2.6;
  const pr = $('#prompt');
  if((nearStation || nearNpc) && !modalOpen()){
    const label = nearStation ? `<b>${esc(nearStation.title)}</b> 책장 열기 · 자료 ${nearStation.files.length}개` : '<b>하나</b>에게 말 걸기';
    pr.innerHTML = isTouch ? label : `<kbd>E</kbd>${label}`; pr.hidden = false; $('#btnAct').hidden = !isTouch;
    $('#btnAct').textContent = nearStation ? '열람' : '대화';
  } else { pr.hidden = true; $('#btnAct').hidden = true; }
  // 연출
  for(const st of stations){ const near = st===nearStation; st.ring.material.opacity = near ? .95 : (st.hasNew ? .45+.3*Math.sin(T*4) : .4); st.ring.scale.setScalar(near ? 1.12 : 1); if(st.badge) st.badge.position.y = 3.35+Math.sin(T*3)*.08; }
  if(guideTarget){ beacon.children[0].material.opacity = .16+.08*Math.sin(T*4);
    const gx = guideTarget.front.x-player.position.x, gz = guideTarget.front.z-player.position.z; const dist = Math.hypot(gx,gz);
    const fwd = gx*-Math.sin(camYaw)+gz*-Math.cos(camYaw), right = gx*Math.cos(camYaw)+gz*-Math.sin(camYaw);
    $('#guideArrow').style.transform = `rotate(${Math.atan2(right,fwd)}rad)`;
    $('#guideText').textContent = `${guideTarget.room?ROOMS[guideTarget.room].full+' › ':''}${guideTarget.title||guideTarget.label} · ${Math.round(dist)}m`;
    if(dist < 1.6){ const g = guideTarget; setGuide(null); if(g.files) toast('도착했어요', `${g.title} 책장`); }
  }
  if(poofT < 1){ poofT += dt*2.2; poof.scale.setScalar(1+poofT*3); poof.material.opacity = (1-poofT)*.9; }
  drawMini(T);
}
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05); T += dt;
  if(mode==='creator'){ updateCreator(dt); renderer.render(cScene, cCam); }
  else if(mode==='world'){ updateWorld(dt); renderer.render(scene, wCam); }
}

/* =========================================================
   12. 시작
   ========================================================= */
(async () => {
  try{ await Promise.race([Promise.all([document.fonts.load('64px "Do Hyeon"'), document.fonts.load('700 40px "Noto Sans KR"')]), new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  bootCatalog();
  $('#loading').style.opacity = 0; setTimeout(()=>$('#loading').remove(), 400);
  openCreator(); loop();
})();
</script>
